services:
  write-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders_write
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders -d orders_write"], interval: 5s, timeout: 3s, retries: 10}
  read-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders_read
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U orders -d orders_read"], interval: 5s, timeout: 3s, retries: 10}
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      WRITE_DB_URL: jdbc:postgresql://write-db:5432/orders_write
      READ_DB_URL: jdbc:postgresql://read-db:5432/orders_read
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      write-db: {condition: service_healthy}
      read-db: {condition: service_healthy}
      kafka: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["4200:8080"]
    depends_on: [api]
