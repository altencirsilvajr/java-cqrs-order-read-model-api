name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Traceability gate
        run: ./scripts/traceability-gate.sh HEAD
      - name: Backend and real infrastructure tests
        run: ./mvnw verify
      - name: Frontend tests and build
        run: npm --prefix frontend ci && npm --prefix frontend test -- --watch=false && npm --prefix frontend run build
      - name: Compose validation
        run: docker compose config --quiet
